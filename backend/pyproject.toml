[project]
name = "jarvis-backend"
version = "0.1.1"
description = "Backend for the JARVIS AI Operating System"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.116.1",
    "starlette==0.47.2",
    "httpx==0.28.1",
    "uvicorn==0.35.0",
    "openai>=1.95.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "psutil>=7.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.3",
    "playwright>=1.61.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Default run is hermetic and fast: skip tests that hit the live LLM API
# (marked `live`). The --timeout is a safety net so a stray live/blocking test
# fails fast instead of hanging the suite.
# Run the live tests explicitly (needs network + NVIDIA_API_KEY):  pytest -m live
addopts = "-m 'not live' --timeout=120 --timeout-method=thread"
markers = [
    "live: makes real network calls to the LLM provider (needs API key + network)",
    "slow: heavy stress/load test (kept in the default suite; opt-out with -m 'not slow')",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]
