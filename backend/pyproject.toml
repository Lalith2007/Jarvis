[project]
name = "jarvis-backend"
version = "0.1.1"
description = "Backend for the JARVIS AI Operating System"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.116.1",
    "starlette==0.47.2",
    "httpx==0.28.1",
    "uvicorn==0.35.0",
    "openai>=1.95.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
